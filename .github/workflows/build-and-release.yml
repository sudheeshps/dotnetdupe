name: Build and Version Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*.*'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Update Version Header from Git Tag
      shell: pwsh
      run: |
        .\scripts\Update-Version.ps1 -Tag '${{ github.ref_name }}'

    - name: Build Solution
      run: |
        msbuild DotNetDupe.sln /p:Configuration=Release /p:Platform=x64

    - name: Run Tests
      run: |
        .\bin\x64\Release\DotNetDupeTests.exe
