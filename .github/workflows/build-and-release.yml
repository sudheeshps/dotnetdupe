name: Build and Release DotNetDupe

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Update Version Header
      shell: powershell
      run: .\scripts\Update-Version.ps1

    - name: Run Code Quality Gate Checks
      shell: powershell
      run: .\scripts\Check-QualityGates.ps1

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore DotNetDupe.sln

    - name: Update Version Build Timestamp
      shell: powershell
      run: |
        $utc = [DateTime]::UtcNow.ToString('yyyy-MM-dd HH:mm:ssZ')
        $local = [DateTime]::Now.ToString('yyyy-MM-dd HH:mm:ss K')
        $rc = Get-Content 'DotNetDupe\DotNetDupe.rc' -Raw
        $updatedRc = $rc -replace 'VALUE "BuildTime",\s*".*"', ("VALUE `"BuildTime`", `"" + $utc + " (Local: " + $local + ")\0`"")
        Set-Content -Path 'DotNetDupe\DotNetDupe.rc' -Value $updatedRc -NoNewline

    - name: Build Windows
      run: msbuild DotNetDupe.sln /p:Configuration=${{ matrix.configuration }} /p:Platform=x64 /p:TreatWarningsAsAbsoluteErrors=true

    - name: Run Tests
      run: .\bin\x64\${{ matrix.configuration }}\DotNetDupeTests.exe

    - name: Install OpenCppCoverage
      if: matrix.configuration == 'Release'
      shell: powershell
      run: |
        $exePath = "C:\Program Files\OpenCppCoverage\OpenCppCoverage.exe"
        $installerUrl = "https://github.com/OpenCppCoverage/OpenCppCoverage/releases/download/release-0.9.9.0/OpenCppCoverageSetup-x64-0.9.9.0.exe"
        $installerPath = "$env:TEMP\OpenCppCoverageSetup-x64-0.9.9.0.exe"

        for ($attempt = 1; $attempt -le 5; $attempt++) {
            Write-Host "Downloading OpenCppCoverage installer (attempt $attempt of 5)..."
            curl.exe -fL --retry 3 --retry-delay 5 --retry-all-errors -o $installerPath $installerUrl
            if ($LASTEXITCODE -eq 0 -and (Test-Path $installerPath)) {
                Start-Process -FilePath $installerPath -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait -NoNewWindow
                if (Test-Path $exePath) {
                    Write-Host "OpenCppCoverage installed successfully."
                    break
                }
            }
            Write-Warning "Attempt $attempt failed. Retrying in 5 seconds..."
            Start-Sleep -Seconds 5
        }

        if (-not (Test-Path $exePath)) {
            Write-Host "Falling back to Chocolatey installation..."
            choco install opencppcoverage -y --no-progress
        }

        if (-not (Test-Path $exePath)) {
            Write-Error "Failed to install OpenCppCoverage after multiple attempts."
            exit 1
        }

    - name: Run OpenCppCoverage & Quality Gate Check
      if: matrix.configuration == 'Release'
      shell: powershell
      run: |
        $exePath = "C:\Program Files\OpenCppCoverage\OpenCppCoverage.exe"
        & $exePath --modules DotNetDupe.dll --sources DotNetDupe --excluded_sources DotNetDupeTests --excluded_sources *Linux* --export_type html:CodeCoverage -- .\bin\x64\Release\DotNetDupeTests.exe
        
        Write-Host "OpenCppCoverage Report Generated Successfully in CodeCoverage/."
        
        # Generate Static Analysis Report inside CodeCoverage/
        .\scripts\Check-QualityGates.ps1 -OutputDir CodeCoverage
        
        # Mirror reports to docs/CodeCoverage for GitHub Pages
        if (Test-Path "docs") {
            Copy-Item -Path "CodeCoverage" -Destination "docs\CodeCoverage" -Recurse -Force
        }
        
        # Quality Gate Enforcement: Require >= 70% coverage on Windows runner
        $htmlContent = Get-Content -Path "CodeCoverage\index.html" -Raw
        if ($htmlContent -match 'cover (\d+) lines \((\d+)%\)') {
            $coveredLines = [int]$matches[1]
            $coveragePct = [int]$matches[2]
            Write-Host "Overall Line Coverage: $coveragePct%"
            if ($coveragePct -lt 70) {
                Write-Error "Quality Gate Failed: Overall Code Coverage ($coveragePct%) is below required 70% threshold!"
                exit 1
            }
        }

    - name: Upload Coverage & Static Analysis Artifact
      if: matrix.configuration == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: code-coverage-report-html
        path: CodeCoverage/

    - name: Deploy Coverage Report to GitHub Pages
      if: matrix.configuration == 'Release' && github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./CodeCoverage

    - name: Upload Windows Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: win-x64-${{ matrix.configuration }}
        path: |
          bin/x64/${{ matrix.configuration }}/DotNetDupe.dll
          bin/x64/${{ matrix.configuration }}/DotNetDupe.lib
          bin/x64/${{ matrix.configuration }}/DotNetDupe.pdb

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Update Version Header
      run: pwsh ./scripts/Update-Version.ps1

    - name: Run Code Quality Gate Checks
      run: pwsh ./scripts/Check-QualityGates.ps1

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake

    - name: Fetch GoogleTest with Retry
      run: |
        for attempt in 1 2 3 4 5; do
          echo "Cloning GoogleTest v1.15.2 (attempt $attempt of 5)..."
          rm -rf build/googletest-src
          if git clone --depth 1 --branch v1.15.2 https://github.com/google/googletest.git build/googletest-src; then
            echo "GoogleTest cloned successfully."
            break
          fi
          echo "Attempt $attempt failed. Retrying in 5 seconds..."
          sleep 5
        done
        test -f build/googletest-src/CMakeLists.txt

    - name: Configure CMake
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DFETCHCONTENT_SOURCE_DIR_GOOGLETEST="$PWD/build/googletest-src"

    - name: Build Linux
      run: cmake --build build --config ${{ matrix.configuration }}

    - name: Run Tests
      run: ./build/DotNetDupeTests

    - name: Upload Linux Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-x64-${{ matrix.configuration }}
        path: build/libDotNetDupe.so

  package:
    needs: [build-windows, build-linux]
    runs-on: windows-latest
    environment: release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Download All Artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts-temp

    - name: Organize Artifacts for Packaging
      run: |
        mkdir -p bin/x64/Release
        mkdir -p build-wsl
        
        # Windows Release
        cp artifacts-temp/win-x64-Release/DotNetDupe.dll bin/x64/Release/
        cp artifacts-temp/win-x64-Release/DotNetDupe.lib bin/x64/Release/
        cp artifacts-temp/win-x64-Release/DotNetDupe.pdb bin/x64/Release/
        
        # Linux Release
        cp artifacts-temp/linux-x64-Release/libDotNetDupe.so build-wsl/

    - name: Generate NuGet README & Run Quality Gate Checks
      shell: powershell
      run: .\scripts\Check-QualityGates.ps1

    - name: Create NuGet Package
      run: nuget pack DotNetDupe.nuspec -OutputDirectory artifacts

    - name: NuGet Login (Trusted Publishing)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: ${{ vars.NUGET_USER || secrets.NUGET_USER || github.repository_owner }}

    - name: Publish to NuGet.org
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        nuget push artifacts\*.nupkg -Source https://api.nuget.org/v3/index.json -ApiKey ${{ steps.nuget-login.outputs.NUGET_API_KEY }} -SkipDuplicate

    - name: Publish to GitHub Packages
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        nuget source Add -Name "GitHub" -Source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" -UserName "${{ github.repository_owner }}" -Password "${{ secrets.GITHUB_TOKEN }}"
        nuget push artifacts\*.nupkg -Source "GitHub" -SkipDuplicate
